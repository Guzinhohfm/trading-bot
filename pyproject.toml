[project]
name = "trading-bot"
version = "0.1.0"
description = "Crypto trading bot: indicadores, estrategia V1 e backtest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
trading-bot = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "backtesting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
